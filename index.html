<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>ลอยกระทง · Loy Krathong</title>
  <link rel="icon" href="lotus.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script defer src="pond.js"></script>
  <script defer src="fullscreen.js"></script>
</head>
<body>
<main id="loy-krathong">

  <div class="actions">
    <button class="release" type="button"><img src="lotus.svg" alt="" width="25" height="25"><span>ลอยกระทง</span></button>
    <div class="caption"><span class="pond-hint">ปัดซ้ายหรือขวาบนผิวน้ำ</span><span role="status"></span></div>
